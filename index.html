<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Prestations SFR</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #3a3a3a;
        }
        th {
            background-color: #333;
        }
        .badge {
            background-color: #444;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Prestations SFR</h2>
    
    <button onclick="exporterXLSX()">📊 Exporter en Excel (.xlsx)</button>

    <table>
        <thead>
            <tr>
                <th>Intervenant</th>
                <th>Type de prestation</th>
                <th>Prix (€)</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="tableau-corps">
            </tbody>
    </table>
</div>

<script>
    // 1. Grille tarifaire SFR corrigée
    const PRIX_SFR = {
        "Aérien": 140,
        "Souterrain": 90,
        "Immeuble": 50,
        "PLP": 25,
        "SAV": 10
    };

    // 2. Exemple de données
    const prestations = [
        {
            intervenant: "BRENDAN",
            type: "Aérien",
            date: "Wed Sep 23 2026 09:00:00 GMT+0200"
        },
        {
            intervenant: "BRENDAN",
            type: "Souterrain",
            date: "Wed Sep 23 2026 00:00:00 GMT+0200"
        },
        {
            intervenant: "HAMLILI",
            type: "Immeuble",
            date: "Mon Sep 21 2026 00:00:00 GMT+0200"
        },
        {
            intervenant: "HAMLILI",
            type: "PLP",
            date: "Mon Sep 21 2026 00:00:00 GMT+0200"
        },
        {
            intervenant: "BRENDAN",
            type: "SAV",
            date: "Wed Sep 23 2026 00:00:00 GMT+0200"
        }
    ];

    // 3. Correction du formatage de date (évite le "undefined/undefined/...")
    function formaterDate(dateString) {
        if (!dateString) return "";
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString; // Retourne brut si conversion impossible

        // Formatage en fr-FR (ex: 23/09/2026 09:00)
        return d.toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });
    }

    // 4. Rendu du tableau HTML
    function afficherTableau() {
        const tbody = document.getElementById("tableau-corps");
        tbody.innerHTML = "";

        prestations.forEach(item => {
            const prix = PRIX_SFR[item.type] !== undefined ? PRIX_SFR[item.type] : 0;
            const dateFormatee = formaterDate(item.date);

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><span class="badge">${item.intervenant}</span></td>
                <td>${item.type}</td>
                <td><strong>${prix} €</strong></td>
                <td>${dateFormatee}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 5. Fonction d'exportation vers un fichier XLSX à télécharger
    function exporterXLSX() {
        // Préparation des données pour Excel
        const donneesExcel = prestations.map(item => ({
            "Intervenant": item.intervenant,
            "Prestation": item.type,
            "Prix (€)": PRIX_SFR[item.type] || 0,
            "Date": formaterDate(item.date)
        }));

        // Création de la feuille de calcul
        const worksheet = XLSX.utils.json_to_sheet(donneesExcel);
        
        // Ajustement de la largeur des colonnes
        worksheet['!cols'] = [
            { wch: 15 }, // Intervenant
            { wch: 18 }, // Prestation
            { wch: 12 }, // Prix (€)
            { wch: 15 }  // Date
        ];

        // Création du classeur
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Prestations SFR");

        // Génération et téléchargement du fichier .xlsx
        XLSX.writeFile(workbook, "prestations_SFR.xlsx");
    }

    // Initialisation
    afficherTableau();
</script>

</body>
</html>
