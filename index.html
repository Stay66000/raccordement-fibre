<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raccordements</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #020617;
    --surface: rgba(10, 16, 31, 0.85);
    --surface-alt: rgba(15, 23, 42, 0.9);
    --border: rgba(30, 58, 110, 0.4);
    --ink: #F8FAFC;
    --ink-muted: #64748B;
    --accent: rgba(12, 28, 68, 0.9);
    --accent-light: #1E40AF;
    --accent-text: #60A5FA;
    --success: #22C55E;
    --success-bg: rgba(34, 197, 94, 0.15);
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.15);
    --radius: 8px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.4;
    padding-bottom: 70px;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 16px;
    color: var(--accent-text);
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  main { padding: 12px; max-width: 900px; margin: 0 auto; }
  section.view { display: none; }
  section.view.active { display: block; }

  .card {
    background: var(--surface);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--accent-text);
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field select,
  .field textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-alt);
    color: var(--ink);
    outline: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent-text);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    flex: 1;
    border: none;
    background: var(--surface-alt);
    color: var(--ink-muted);
    padding: 10px 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.selected {
    background: var(--accent);
    color: #FFF;
  }
  .seg button.selected.ok { background: var(--success-bg); color: var(--success); }
  .seg button.selected.bad { background: var(--danger-bg); color: var(--danger); }

  .preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    margin: 12px 0;
  }
  .preview .amount { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--accent-text); }

  .btn-primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent-light);
    color: #FFF;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .date-pill {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-text);
  }
  .month-total-pill {
    background: var(--accent);
    border: 1px solid var(--border);
    color: var(--accent-text);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
  }

  .table-container {
    overflow-x: auto;
    background: var(--surface);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table.custom-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
  }
  table.custom-table th {
    background: var(--surface-alt);
    color: var(--accent-text);
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
  }
  table.custom-table td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.custom-table tr:last-child td { border-bottom: none; }
  table.custom-table tr:hover { background: rgba(255, 255, 255, 0.03); cursor: pointer; }

  .badge-statut { font-size: 14px; }
  .badge-typo {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
  }
  .badge-op {
    background: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
  }
  .tarif-val {
    font-family: var(--font-mono);
    font-weight: 700;
    color: #FFF;
  }

  /* MODAL DE DETAIL */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 12px;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .modal-title { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--accent-text); }

  /* TABBAR BOTTOM */
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--surface);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .tabbar button {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px;
    background: none; border: none; color: var(--ink-muted);
    cursor: pointer; font-size: 10px; font-weight: 600;
  }
  .tabbar button.active { color: var(--accent-text); }
  .tabbar svg { width: 18px; height: 18px; }

  .toast {
    position: fixed;
    bottom: 60px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent-light); color: #FFF;
    padding: 8px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    opacity: 0; pointer-events: none;
    transition: all 0.2s ease; z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Raccordements</div>
  <div class="header-actions">
    <button class="btn-ghost" id="reloadBtn">🔄 Synchro</button>
  </div>
</header>

<main>

  <section class="view active" id="view-saisie">
    <div class="card">
      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Opérateur</label>
        <div class="seg" id="f-op">
          <button data-val="Orange" class="selected">Orange</button>
          <button data-val="SFR">SFR</button>
        </div>
      </div>
      <div class="field">
        <label for="f-num">N° intervention / Réf</label>
        <input type="text" id="f-num" placeholder="Ex : 0468934875">
      </div>
      <div class="field">
        <label for="f-typo">Typologie raccordement</label>
        <select id="f-typo">
          <option value="">-- Sélectionner une typologie --</option>
        </select>
      </div>
      <div class="field">
        <label for="f-addr">Adresse client</label>
        <input type="text" id="f-addr" placeholder="12 rue de la Paix, Perpignan">
      </div>
      <div class="field">
        <label>Résultat</label>
        <div class="seg" id="f-statut">
          <button data-val="Réussite" class="ok selected">👍 Succès</button>
          <button data-val="Échec" class="bad">❌ Échec</button>
        </div>
      </div>

      <div class="field">
        <label>Mode de travail</label>
        <div class="seg" id="f-solo">
          <button data-val="Solo" class="selected">Solo</button>
          <button data-val="Binôme">Binôme</button>
        </div>
      </div>

      <div class="field" id="wrap-tech-solo" style="display:block;">
        <label for="f-tech-solo">Technicien en Solo</label>
        <select id="f-tech-solo">
          <option value="Brendan">Brendan</option>
          <option value="Hamlili">Hamlili</option>
        </select>
      </div>

      <div class="field">
        <label for="f-comment">Commentaire</label>
        <input type="text" id="f-comment" placeholder="Remarques, détails...">
      </div>

      <div class="preview">
        <span style="font-size:12px; color:var(--ink-muted);">Montant estimé</span>
        <span class="amount" id="f-preview">0,00 €</span>
      </div>

      <button class="btn-primary" id="f-save">Enregistrer l'intervention</button>
    </div>
  </section>

  <section class="view" id="view-carburant">
    <div class="card">
      <div class="field">
        <label for="fuel-date">Date du plein</label>
        <input type="date" id="fuel-date">
      </div>
      <div class="field">
        <label for="fuel-amount">Montant Carburant (€)</label>
        <input type="number" step="0.01" id="fuel-amount" placeholder="60.00">
      </div>
      <div class="field">
        <label for="fuel-comment">Station / Commentaire</label>
        <input type="text" id="fuel-comment" placeholder="Station Total Perpignan">
      </div>
      <button class="btn-primary" id="fuel-save">Enregistrer le plein</button>
    </div>

    <div class="filter-bar">
      <div class="month-total-pill" id="fuelMonthTotal">Total Mois : 0,00 €</div>
    </div>
    <div id="fuelList"></div>
  </section>

  <section class="view" id="view-historique">
    <div class="field" style="margin-bottom:10px;">
      <label>Technicien sélectionné :</label>
      <div class="seg" id="hist-tech-select">
        <button data-val="Brendan" class="selected">Brendan</button>
        <button data-val="Hamlili">Hamlili</button>
      </div>
    </div>

    <div class="filter-bar">
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn-ghost" id="prevMonth">‹</button>
        <div class="date-pill" id="monthLabel">Mois</div>
        <button class="btn-ghost" id="nextMonth">›</button>
      </div>
      <div class="month-total-pill" id="totalGlobalBadge">Total : 0,00 €</div>
    </div>

    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="histSearch" placeholder="🔍 Rechercher Réf, Typologie, Adresse...">
    </div>

    <div class="table-container">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Ref</th>
            <th>Statut</th>
            <th>Typologie</th>
            <th>Opérateur</th>
            <th>Tarif</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="speedTableBody">
          </tbody>
      </table>
    </div>

    <button class="btn-primary" id="exportXlsx" style="margin-top:12px; font-size:12px;">Exporter en Excel (.xlsx)</button>
  </section>

  <section class="view" id="view-tarifs">
    <div class="card">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid var(--border); text-align:left; color:var(--accent-text);">
            <th style="padding:8px;">Typologie</th>
            <th style="padding:8px;">Orange</th>
            <th style="padding:8px;">SFR</th>
          </tr>
        </thead>
        <tbody id="tariffRows"></tbody>
      </table>
    </div>
  </section>

</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Réf</div>
      <button class="btn-ghost" id="closeModal">✕ Fermer</button>
    </div>
    <div class="field">
      <label>Date :</label>
      <input type="text" id="m-date">
    </div>
    <div class="field">
      <label>Ref intervention :</label>
      <input type="text" id="m-num">
    </div>
    <div class="field">
      <label>Technicien :</label>
      <input type="text" id="m-planning">
    </div>
    <div class="field">
      <label>Typologie :</label>
      <input type="text" id="m-typo">
    </div>
    <div class="field">
      <label>Statut :</label>
      <div class="seg" id="m-statut-seg">
        <button data-val="Réussite" class="ok">👍 Succès</button>
        <button data-val="Échec" class="bad">❌ Échec</button>
      </div>
    </div>
    <div class="field">
      <label>Commentaires :</label>
      <textarea id="m-comment" rows="2"></textarea>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn-primary" id="m-save-btn">Mettre à jour</button>
      <button class="btn-ghost" id="m-del-btn" style="color:var(--danger); border-color:var(--danger);">Supprimer</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <button data-view="saisie" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Saisie
  </button>
  <button data-view="carburant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v18M13 11h4a2 2 0 0 1 2 2v7a2 2 0 0 0 2 2M13 6h4"/><circle cx="7" cy="7" r="2"/></svg>
    Carburant
  </button>
  <button data-view="historique">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Historique
  </button>
  <button data-view="tarifs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    Tarifs
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUZ8Va_VV_J15W6gH26Xxq_MimoGbLfU_6cUUfxHhiRMqOMnBghSyWpkAx90zRtk1q/exec";

  var TYPOS = ["Aérien", "Souterrain", "Immeuble", "PLP", "PLP sans client", "SAV"];
  var STORE_KEY = "raccordements_entries_v7";
  var FUEL_STORE_KEY = "raccordements_fuel_v7";
  var TARIFF_KEY = "raccordements_tarifs_v7";

  var DEFAULT_TARIFFS = {
    "Aérien": {Orange:160.00, SFR:140.50},
    "Souterrain": {Orange:112.00, SFR:85.00},
    "Immeuble": {Orange:54.40, SFR:50.00},
    "PLP": {Orange:36.00, SFR:25.20},
    "PLP sans client": {Orange:12.00, SFR:12.00},
    "SAV": {Orange:36.00, SFR:23.40}
  };

  function safeGet(key, fallback){
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  }
  function safeSet(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }

  var currentViewTech = "Brendan";
  var entries = safeGet(STORE_KEY + "_" + currentViewTech, []);
  var fuelEntries = safeGet(FUEL_STORE_KEY, []);
  var tariffs = safeGet(TARIFF_KEY, DEFAULT_TARIFFS);

  var form = { typo: "", statut: "Réussite", op: "Orange", solo: "Solo", techSolo: "Brendan" };
  var viewedMonth = new Date();
  var selectedModalEntry = null;

  function fmtEuro(n){
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
  }

  function parseISO(dateVal) {
    if (!dateVal) return new Date();
    if (dateVal instanceof Date) return isNaN(dateVal.getTime()) ? new Date() : dateVal;
    if (typeof dateVal === 'number') return new Date(dateVal);

    if (typeof dateVal === 'string') {
      var s = dateVal.trim();
      if (!s) return new Date();

      if (s.indexOf('/') !== -1) {
        var p = s.split('/');
        if (p.length === 3) {
          var day = parseInt(p[0], 10);
          var month = parseInt(p[1], 10) - 1;
          var year = parseInt(p[2], 10);
          if (!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
        }
      }

      if (s.indexOf('-') !== -1 && s.indexOf(' ') === -1 && s.indexOf('GMT') === -1) {
        var p = s.split('T')[0].split('-');
        if (p.length === 3) {
          var year = parseInt(p[0], 10);
          var month = parseInt(p[1], 10) - 1;
          var day = parseInt(p[2], 10);
          if (!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
        }
      }

      var parsed = new Date(s);
      if (!isNaN(parsed.getTime())) return parsed;
    }
    return new Date();
  }

  function sortByDateDesc(arr) {
    return arr.slice().sort(function(a, b) {
      return parseISO(b.date).getTime() - parseISO(a.date).getTime();
    });
  }

  function toISODate(dateVal) {
    var d = parseISO(dateVal);
    var day = String(d.getDate()).padStart(2, '0');
    var m = String(d.getMonth() + 1).padStart(2, '0');
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function fmtDateFR(dateVal) {
    var d = parseISO(dateVal);
    var day = String(d.getDate()).padStart(2, '0');
    var m = String(d.getMonth() + 1).padStart(2, '0');
    return day + "/" + m + "/" + d.getFullYear();
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }

  function loadEntries(){
    renderHistorique();
    if (!SCRIPT_URL) return;
    toast("Synchro (" + currentViewTech + ")...");

    var url = SCRIPT_URL + "?tech=" + encodeURIComponent(currentViewTech) + "&_t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (Array.isArray(data)){
          var map = {};
          data.forEach(function(e){ map[e.num || e.id] = e; });
          entries = sortByDateDesc(Object.values(map));
          safeSet(STORE_KEY + "_" + currentViewTech, entries);
          renderHistorique();
          toast("À jour (" + currentViewTech + ")");
        }
      })
      .catch(function(){ toast("Mode local (hors-ligne)"); });
  }
  window.loadEntries = loadEntries;

  function loadFuel(){
    renderCarburant();
    if (!SCRIPT_URL) return;
    fetch(SCRIPT_URL + "?type=fuel&_t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (Array.isArray(data)){
          fuelEntries = sortByDateDesc(data);
          safeSet(FUEL_STORE_KEY, fuelEntries);
          renderCarburant();
        }
      });
  }
  window.loadFuel = loadFuel;

  // Navigation Onglets
  document.querySelectorAll('.tabbar button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      var v = btn.getAttribute('data-view');
      document.querySelectorAll('.view').forEach(function(s){ s.classList.remove('active'); });
      document.getElementById('view-' + v).classList.add('active');
      if (v === 'carburant') loadFuel();
      if (v === 'historique') renderHistorique();
      if (v === 'tarifs') renderTarifs();
    });
  });

  // Typologies
  var typoSelect = document.getElementById('f-typo');
  TYPOS.forEach(function(t){
    var opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typoSelect.appendChild(opt);
  });
  typoSelect.addEventListener('change', function(){ form.typo = typoSelect.value; updatePreview(); });

  function updateOpPlaceholder(opVal){
    var input = document.getElementById('f-num');
    if (opVal === "Orange") {
      input.placeholder = "Ex : 0468934875";
    } else {
      input.placeholder = "Ex : 133627482";
    }
  }

  function wireSeg(id, key, callback){
    var wrap = document.getElementById(id);
    wrap.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        form[key] = b.dataset.val;
        wrap.querySelectorAll('button').forEach(function(x){ x.classList.remove('selected'); });
        b.classList.add('selected');
        if (callback) callback(b.dataset.val);
        updatePreview();
      });
    });
  }
  wireSeg('f-statut', 'statut');
  wireSeg('f-op', 'op', function(v){
    updateOpPlaceholder(v);
  });
  wireSeg('f-solo', 'solo', function(v){
    document.getElementById('wrap-tech-solo').style.display = (v === 'Solo') ? 'block' : 'none';
  });

  function computeMontant(typo, statut, op){
    if (!typo || statut === "Échec") return 0;
    var row = tariffs[typo];
    if (!row) return 0;
    var v = (op === "Orange") ? row.Orange : row.SFR;
    return v || 0;
  }

  function updatePreview(){
    var m = computeMontant(form.typo, form.statut, form.op);
    document.getElementById('f-preview').textContent = fmtEuro(m);
  }

  document.getElementById('f-date').value = toISODate(new Date());
  document.getElementById('fuel-date').value = toISODate(new Date());

  // Enregistrer intervention
  document.getElementById('f-save').addEventListener('click', function(){
    var date = document.getElementById('f-date').value;
    var num = document.getElementById('f-num').value.trim();
    var addr = document.getElementById('f-addr').value.trim();
    var comment = document.getElementById('f-comment').value.trim();

    if (!date || !num || !form.typo){
      toast("Complète les champs requis");
      return;
    }

    var montant = computeMontant(form.typo, form.statut, form.op);

    var entry = {
      id: "INT-" + Math.floor(10000 + Math.random() * 90000),
      num: num,
      date: date,
      addr: addr,
      typo: form.typo,
      statut: form.statut,
      op: form.op,
      solo: form.solo,
      techSolo: document.getElementById('f-tech-solo').value,
      montant: montant,
      comment: comment
    };

    entries.push(entry);
    entries = sortByDateDesc(entries);
    safeSet(STORE_KEY + "_" + currentViewTech, entries);
    renderHistorique();
    toast("Intervention ajoutée !");

    if (SCRIPT_URL) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(entry)
      });
    }
  });

  // Carburant Saisie & Suppression
  document.getElementById('fuel-save').addEventListener('click', function(){
    var date = document.getElementById('fuel-date').value;
    var amount = parseFloat(document.getElementById('fuel-amount').value);
    var comment = document.getElementById('fuel-comment').value.trim();

    if (!date || isNaN(amount) || amount <= 0) {
      toast("Saisis un montant valide");
      return;
    }

    var fuelEntry = {
      id: "FUEL-" + Date.now(),
      date: date,
      montant: amount,
      tech: currentViewTech,
      comment: comment
    };

    fuelEntries.push(fuelEntry);
    fuelEntries = sortByDateDesc(fuelEntries);
    safeSet(FUEL_STORE_KEY, fuelEntries);
    renderCarburant();
    document.getElementById('fuel-amount').value = "";
    document.getElementById('fuel-comment').value = "";
    toast("Plein enregistré !");

    if (SCRIPT_URL) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(Object.assign({ type: "fuel" }, fuelEntry))
      });
    }
  });

  function deleteFuel(id) {
    if (!confirm("Supprimer ce plein d'essence ?")) return;
    fuelEntries = fuelEntries.filter(function(f){ return (f.id || f.date + f.montant) !== id; });
    safeSet(FUEL_STORE_KEY, fuelEntries);
    renderCarburant();
    toast("Plein supprimé");
  }

  function renderCarburant(){
    var list = document.getElementById('fuelList');
    list.innerHTML = "";
    var y = viewedMonth.getFullYear(), m = viewedMonth.getMonth();
    var monthFuel = fuelEntries.filter(function(f){
      var d = parseISO(f.date);
      return d.getFullYear() === y && d.getMonth() === m;
    });

    var totMois = monthFuel.reduce(function(s,f){ return s + (f.montant||0); }, 0);
    document.getElementById('fuelMonthTotal').textContent = "Total Mois : " + fmtEuro(totMois);

    if (monthFuel.length === 0){
      list.innerHTML = '<div style="color:var(--ink-muted); text-align:center; padding:20px;">Aucun plein enregistré.</div>';
      return;
    }

    monthFuel.forEach(function(f, idx){
      var fid = f.id || (f.date + "_" + f.montant + "_" + idx);
      var div = document.createElement('div');
      div.className = 'card';
      div.style.display = 'flex';
      div.style.justifyContent = 'space-between';
      div.style.alignItems = 'center';
      div.innerHTML = 
        '<div>' +
          '<strong>' + fmtDateFR(f.date) + '</strong>' +
          (f.comment ? '<div style="font-size:11px; color:var(--ink-muted);">' + escapeHtml(f.comment) + '</div>' : '') +
        '</div>' +
        '<div style="display:flex; align-items:center; gap:10px;">' +
          '<span style="font-family:var(--font-mono); color:var(--danger); font-weight:700;">' + fmtEuro(f.montant) + '</span>' +
          '<button class="btn-ghost btn-del-fuel" data-fid="' + fid + '" style="color:var(--danger); border-color:rgba(239, 68, 68, 0.4); padding:2px 8px; font-size:12px;">✕</button>' +
        '</div>';

      div.querySelector('.btn-del-fuel').addEventListener('click', function(){
        deleteFuel(fid);
      });
      list.appendChild(div);
    });
  }

  // Affichage Historique
  var MOIS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

  function renderHistorique(){
    var y = viewedMonth.getFullYear(), m = viewedMonth.getMonth();
    document.getElementById('monthLabel').textContent = MOIS_FR[m] + " " + y;

    var monthEntries = entries.filter(function(e){
      var d = parseISO(e.date);
      return d.getFullYear() === y && d.getMonth() === m;
    });

    var q = document.getElementById('histSearch').value.trim().toLowerCase();
    if (q) {
      monthEntries = monthEntries.filter(function(e){
        return (e.num + " " + (e.comment||"") + " " + e.typo + " " + e.op).toLowerCase().indexOf(q) !== -1;
      });
    }

    monthEntries = sortByDateDesc(monthEntries);

    var totMois = monthEntries.reduce(function(s,e){ return s + (e.montant||0); }, 0);
    document.getElementById('totalGlobalBadge').textContent = MOIS_FR[m] + " : " + fmtEuro(totMois);

    var tbody = document.getElementById('speedTableBody');
    tbody.innerHTML = "";

    if (monthEntries.length === 0){
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--ink-muted); padding:20px;">Aucune intervention trouvée.</td></tr>';
      return;
    }

    monthEntries.forEach(function(e){
      var tr = document.createElement('tr');
      var iconStatut = e.statut === "Réussite" ? "👍" : "❌";

      tr.innerHTML = 
        '<td><span style="font-family:var(--font-mono); font-weight:700; color:var(--accent-text);">' + escapeHtml(e.num) + '</span></td>' +
        '<td class="badge-statut">' + iconStatut + '</td>' +
        '<td><span class="badge-typo">' + escapeHtml(e.typo) + '</span></td>' +
        '<td><span class="badge-op">' + escapeHtml(e.op) + '</span></td>' +
        '<td class="tarif-val">' + fmtEuro(e.montant) + '</td>' +
        '<td><button class="btn-ghost" style="padding:2px 6px;">✏️</button></td>';

      tr.addEventListener('click', function(){ openModal(e); });
      tbody.appendChild(tr);
    });
  }

  // Modal Detail / Edition
  function openModal(e){
    selectedModalEntry = e;
    document.getElementById('modalTitle').textContent = "Réf : " + escapeHtml(e.num);
    document.getElementById('m-date').value = fmtDateFR(e.date);
    document.getElementById('m-num').value = e.num;
    document.getElementById('m-planning').value = e.techSolo || currentViewTech;
    document.getElementById('m-typo').value = e.typo;
    document.getElementById('m-comment').value = e.comment || "";

    var seg = document.getElementById('m-statut-seg');
    seg.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('selected', b.dataset.val === e.statut);
    });

    document.getElementById('detailModal').classList.add('active');
  }

  document.getElementById('closeModal').addEventListener('click', function(){
    document.getElementById('detailModal').classList.remove('active');
  });

  document.getElementById('m-save-btn').addEventListener('click', function(){
    if (!selectedModalEntry) return;
    selectedModalEntry.num = document.getElementById('m-num').value;
    selectedModalEntry.typo = document.getElementById('m-typo').value;
    selectedModalEntry.comment = document.getElementById('m-comment').value;

    safeSet(STORE_KEY + "_" + currentViewTech, entries);
    renderHistorique();
    document.getElementById('detailModal').classList.remove('active');
    toast("Mise à jour enregistrée");
  });

  document.getElementById('m-del-btn').addEventListener('click', function(){
    if (!selectedModalEntry || !confirm("Supprimer cette intervention ?")) return;
    entries = entries.filter(function(x){ return x !== selectedModalEntry; });
    safeSet(STORE_KEY + "_" + currentViewTech, entries);
    renderHistorique();
    document.getElementById('detailModal').classList.remove('active');
    toast("Intervention supprimée");
  });

  document.getElementById('hist-tech-select').querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      currentViewTech = b.dataset.val;
      document.getElementById('hist-tech-select').querySelectorAll('button').forEach(function(x){ x.classList.remove('selected'); });
      b.classList.add('selected');
      entries = sortByDateDesc(safeGet(STORE_KEY + "_" + currentViewTech, []));
      loadEntries();
    });
  });

  document.getElementById('prevMonth').addEventListener('click', function(){ viewedMonth.setMonth(viewedMonth.getMonth() - 1); renderHistorique(); });
  document.getElementById('nextMonth').addEventListener('click', function(){ viewedMonth.setMonth(viewedMonth.getMonth() + 1); renderHistorique(); });
  document.getElementById('histSearch').addEventListener('input', renderHistorique);
  document.getElementById('reloadBtn').addEventListener('click', loadEntries);

  function renderTarifs(){
    var tbody = document.getElementById('tariffRows');
    tbody.innerHTML = "";
    TYPOS.forEach(function(t){
      var tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid var(--border)';
      var tOrg = tariffs[t] ? tariffs[t].Orange : 0;
      var tSfr = tariffs[t] ? tariffs[t].SFR : 0;
      tr.innerHTML = 
        '<td style="padding:8px;"><strong>' + escapeHtml(t) + '</strong></td>' +
        '<td style="padding:8px;"><input type="number" step="0.01" style="width:70px; padding:4px; border:1px solid var(--border); border-radius:4px; background:var(--surface-alt); color:#FFF;" value="' + tOrg + '"></td>' +
        '<td style="padding:8px;"><input type="number" step="0.01" style="width:70px; padding:4px; border:1px solid var(--border); border-radius:4px; background:var(--surface-alt); color:#FFF;" value="' + tSfr + '"></td>';
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    updateOpPlaceholder("Orange");
    loadEntries();
  });

})();
</script>
</body>
</html>
