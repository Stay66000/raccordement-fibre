<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raccordements</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #070D19;
    --surface: rgba(15, 23, 42, 0.75);
    --surface-alt: rgba(30, 41, 59, 0.75);
    --border: rgba(51, 65, 85, 0.6);
    --ink: #F8FAFC;
    --ink-muted: #94A3B8;
    --accent: rgba(30, 58, 138, 0.75);
    --accent-light: rgba(59, 130, 246, 0.75);
    --accent-text: #60A5FA;
    --success: #22C55E;
    --success-bg: rgba(34, 197, 94, 0.15);
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.15);
    --radius: 8px;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.4;
    padding-bottom: 70px;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 16px;
    color: var(--accent-text);
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  main { padding: 12px; max-width: 900px; margin: 0 auto; }
  section.view { display: none; }
  section.view.active { display: block; }

  .card {
    background: var(--surface);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--accent-text);
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field select,
  .field textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-alt);
    color: var(--ink);
    outline: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent-text);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
  }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    flex: 1;
    border: none;
    background: var(--surface-alt);
    color: var(--ink-muted);
    padding: 10px 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button.selected {
    background: var(--accent);
    color: #FFF;
  }
  .seg button.selected.ok { background: var(--success-bg); color: var(--success); }
  .seg button.selected.bad { background: var(--danger-bg); color: var(--danger); }

  .preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    margin: 12px 0;
  }
  .preview .amount { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--accent-text); }

  .btn-primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent-light);
    color: #FFF;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .date-pill {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-text);
  }
  .month-total-pill {
    background: var(--accent);
    border: 1px solid var(--border);
    color: var(--accent-text);
    padding: 6px 14px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
  }

  .table-container {
    overflow-x: auto;
    background: var(--surface);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table.custom-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    text-align: left;
    white-space: nowrap;
  }
  table.custom-table th {
    background: var(--surface-alt);
    color: var(--accent-text);
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
  }
  table.custom-table td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.custom-table tr:last-child td { border-bottom: none; }
  table.custom-table tr:hover { background: rgba(255, 255, 255, 0.03); cursor: pointer; }

  .badge-statut { font-size: 14px; }
  .badge-typo {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
  }
  .badge-op {
    background: rgba(59, 130, 246, 0.15);
    color: #60A5FA;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
  }
  .tarif-val {
    font-family: var(--font-mono);
    font-weight: 700;
    color: #FFF;
  }

  /* MODAL DE DETAIL */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 12px;
  }
  .modal-overlay.active { display: flex; }
  .modal-card {
    background: var(--surface);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .modal-title { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--accent-text); }

  /* TABBAR BOTTOM */
  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--surface);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .tabbar button {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px;
    background: none; border: none; color: var(--ink-muted);
    cursor: pointer; font-size: 10px; font-weight: 600;
  }
  .tabbar button.active { color: var(--accent-text); }
  .tabbar svg { width: 18px; height: 18px; }

  .toast {
    position: fixed;
    bottom: 60px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent-light); color: #FFF;
    padding: 8px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    opacity: 0; pointer-events: none;
    transition: all 0.2s ease; z-index: 1000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Raccordements</div>
  <div class="header-actions">
    <button class="btn-ghost" id="reloadBtn">🔄 Synchro</button>
  </div>
</header>

<main>

  <section class="view active" id="view-saisie">
    <div class="card">
      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Opérateur</label>
        <div class="seg" id="f-op">
          <button data-val="Orange" class="selected">Orange</button>
          <button data-val="SFR">SFR</button>
        </div>
      </div>
      <div class="field">
        <label for="f-num">N° intervention / Réf</label>
        <input type="text" id="f-num" placeholder="Ex : 0468934875">
      </div>
      <div class="field">
        <label for="f-typo">Typologie raccordement</label>
        <select id="f-typo">
          <option value="">-- Sélectionner une typologie --</option>
        </select>
      </div>
      <div class="field">
        <label for="f-zone">Zone</label>
        <input type="text" id="f-zone" value="66">
      </div>
      <div class="field">
        <label for="f-addr">Adresse client</label>
        <input type="text" id="f-addr" placeholder="12 rue de la Paix, Perpignan">
      </div>
      <div class="field">
        <label>Résultat</label>
        <div class="seg" id="f-statut">
          <button data-val="Réussite" class="ok selected">👍 Succès</button>
          <button data-val="Échec" class="bad">❌ Échec</button>
        </div>
      </div>

      <div class="field">
        <label>Mode de travail</label>
        <div class="seg" id="f-solo">
          <button data-val="Solo" class="selected">Solo</button>
          <button data-val="Binôme">Binôme</button>
        </div>
      </div>

      <div class="field" id="wrap-tech-solo" style="display:block;">
        <label for="f-tech-solo">Technicien en Solo</label>
        <select id="f-tech-solo">
          <option value="Brendan">Brendan</option>
          <option value="Hamlili">Hamlili</option>
        </select>
      </div>

      <div class="field">
        <label for="f-comment">Commentaire</label>
        <input type="text" id="f-comment" placeholder="Remarques, détails...">
      </div>

      <div class="preview">
        <span style="font-size:12px; color:var(--ink-muted);">Montant estimé</span>
        <span class="amount" id="f-preview">0,00 €</span>
      </div>

      <button class="btn-primary" id="f-save">Enregistrer l'intervention</button>
    </div>
  </section>

  <section class="view" id="view-carburant">
    <div class="card">
      <div class="field">
        <label for="fuel-date">Date du plein</label>
        <input type="date" id="fuel-date">
      </div>
      <div class="field">
        <label for="fuel-amount">Montant Carburant (€)</label>
        <input type="number" step="0.01" id="fuel-amount" placeholder="60.00">
      </div>
      <div class="field">
        <label for="fuel-comment">Station / Commentaire</label>
        <input type="text" id="fuel-comment" placeholder="Station Total Perpignan">
      </div>
      <button class="btn-primary" id="fuel-save">Enregistrer le plein</button>
    </div>

    <div class="filter-bar">
      <div class="month-total-pill" id="fuelMonthTotal">Total Mois : 0,00 €</div>
    </div>
    <div id="fuelList"></div>
  </section>

  <section class="view" id="view-historique">
    <div class="field" style="margin-bottom:10px;">
      <label>Technicien sélectionné :</label>
      <div class="seg" id="hist-tech-select">
        <button data-val="Brendan" class="selected">Brendan</button>
        <button data-val="Hamlili">Hamlili</button>
      </div>
    </div>

    <div class="filter-bar">
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn-ghost" id="prevMonth">‹</button>
        <div class="date-pill" id="monthLabel">Mois</div>
        <button class="btn-ghost" id="nextMonth">›</button>
      </div>
      <div class="month-total-pill" id="totalGlobalBadge">Total : 0,00 €</div>
    </div>

    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="histSearch" placeholder="🔍 Rechercher Réf, Typologie, Adresse...">
    </div>

    <div class="table-container">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Ref</th>
            <th>Statut</th>
            <th>Typologie</th>
            <th>Zone</th>
            <th>Opérateur</th>
            <th>Tarif</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="speedTableBody">
          </tbody>
      </table>
    </div>

    <button class="btn-primary" id="exportXlsx" style="margin-top:12px; font-size:12px;">Exporter en Excel (.xlsx)</button>
  </section>

  <section class="view" id="view-tarifs">
    <div class="card">
      <table style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid var(--border); text-align:left; color:var(--accent-text);">
            <th style="padding:8px;">Typologie</th>
            <th style="padding:8px;">Orange</th>
            <th style="padding:8px;">SFR</th>
          </tr>
        </thead>
        <tbody id="tariffRows"></tbody>
      </table>
    </div>
  </section>

</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Réf</div>
      <button class="btn-ghost" id="closeModal">✕ Fermer</button>
    </div>
    <div class="field">
      <label>Zone :</label>
      <input type="text" id="m-zone">
    </div>
    <div class="field">
      <label>Date :</label>
      <input type="text" id="m-date">
    </div>
    <div class="field">
      <label>Ref intervention :</label>
      <input type="text" id="m-num">
    </div>
    <div class="field">
      <label>Technicien :</label>
      <input type="text" id="m-planning">
    </div>
    <div class="field">
      <label>Typologie :</label>
      <input type="text" id="m-typo">
    </div>
    <div class="field">
      <label>Statut :</label>
      <div class="seg" id="m-statut-seg">
        <button data-val="Réussite" class="ok">👍 Succès</button>
        <button data-val="Échec" class="bad">❌ Échec</button>
      </div>
    </div>
    <div class="field">
      <label>Commentaires :</label>
      <textarea id="m-comment" rows="2"></textarea>
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn-primary" id="m-save-btn">Mettre à jour</button>
      <button class="btn-ghost" id="m-del-btn" style="color:var(--danger); border-color:var(--danger);">Supprimer</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <button data-view="saisie" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Saisie
  </button>
  <button data-view="carburant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v18M13 11h4a2 2 0 0 1 2 2v7a2 2 0 0 0 2 2M13 6h4"/><circle cx="7" cy="7" r="2"/></svg>
    Carburant
  </button>
  <button data-view="historique">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Historique
  </button>
  <button data-view="tarifs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    Tarifs
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUZ8Va_VV_J15W6gH26Xxq_MimoGbLfU_6cUUfxHhiRMqOMnBghSyWpkAx90zRtk1q/exec";

  var TYPOS = ["Aérien", "Souterrain", "Immeuble", "PLP", "PLP sans client", "SAV"];
  var STORE_KEY = "raccordements_entries_v6";
  var FUEL_STORE_KEY = "raccordements_fuel_v6";
  var TARIFF_KEY = "raccordements_tarifs_v6";

  var DEFAULT_TARIFFS = {
    "Aérien": {Orange:160.00, SFR:140.50},
    "Souterrain": {Orange:112.00, SFR:85.00},
    "Immeuble": {Orange:54.40, SFR:50.00},
    "PLP": {Orange:36.00, SFR:25.20},
    "PLP sans client": {Orange:12.00, SFR:12.00},
    "SAV": {Orange:36.00, SFR:23.40}
  };

  function safeGet(key, fallback){
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch(e){ return fallback; }
  }
  function safeSet(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ return false; }
  }

  var currentViewTech = "Brendan";
  var entries = safeGet(STORE_KEY + "_" + currentViewTech, []);
  var fuelEntries = safeGet(FUEL_STORE_KEY, []);
  var tariffs = safeGet(TARIFF_KEY, DEFAULT_TARIFFS);

  var form = { typo: "", statut: "Réussite", op: "Orange", solo: "Solo", techSolo: "Brendan" };
  var viewedMonth = new Date();
  var selectedModalEntry = null;

  function fmtEuro(n){
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
  }

  function parseISO(dateVal) {
    if (!dateVal) return new Date();
    if (dateVal instanceof Date) return isNaN(dateVal.getTime()) ? new Date() : dateVal;
    if (typeof dateVal === 'number') return new Date(dateVal);

    if (typeof dateVal === 'string') {
      var s = dateVal.trim();
      if (!s) return new Date();

      if (s.indexOf('/') !== -1) {
        var p = s.split('/');
        if (p.length === 3) {
          var day = parseInt(p[0], 10);
          var month = parseInt(p[1], 10) - 1;
          var year = parseInt(p[2], 10);
          if (!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
        }
      }

      if (s.indexOf('-') !== -1 && s.indexOf(' ') === -1 && s.indexOf('GMT') === -1) {
        var p = s.split('T')[0].split('-');
        if (p.length === 3) {
          var year = parseInt(p[0], 10);
          var month = parseInt(p[1], 10) - 1;
          var day = parseInt(p[2], 10);
          if (!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
        }
      }

      var parsed = new Date(s);
      if (!isNaN(parsed.getTime())) return parsed;
    }
    return new Date();
  }

  function sortByDateDesc(arr) {
    return arr.slice().sort(function(a, b) {
      return parseISO(b.date).getTime() - parseISO(a.date).getTime();
    });
  }

  function toISODate(dateVal) {
    var d = parseISO(dateVal);
    var day = String(d.getDate()).padStart(2, '0');
    var m = String(d.getMonth() + 1).padStart(2, '0');
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function fmtDateFR(date
