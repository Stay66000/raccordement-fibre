<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raccordements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F4F5F1;
    --surface: #FFFFFF;
    --surface-alt: #EBF0EA;
    --ink: #131A16;
    --ink-muted: #627067;
    --line: #DCE2D7;
    --accent: #FF6A18;
    --accent-ink: #FFFFFF;
    --blue: #1B4B91;
    --blue-tint: #EEF3FA;
    --success: #1E7A4C;
    --success-tint: #E8F5ED;
    --danger: #B8391F;
    --danger-tint: #FBECE8;
    --orange-soft: #FAF0E8;
    --orange-ink: #A64B14;
    --radius: 10px;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121517;
      --surface: #1B2023;
      --surface-alt: #22282C;
      --ink: #EDF1EE;
      --ink-muted: #8E9E95;
      --line: #2E3539;
      --accent: #FF7A2E;
      --accent-ink: #121517;
      --blue: #6C9FE0;
      --blue-tint: #1B2635;
      --success: #52C98A;
      --success-tint: #152E20;
      --danger: #F2745A;
      --danger-tint: #331C17;
      --orange-soft: #2B2019;
      --orange-ink: #F08C4A;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  .brand strong { color: var(--ink); }
  h1 { margin: 2px 0 0; font-family: var(--font-mono); font-size: 19px; font-weight: 600; }

  main { padding: 12px 14px 84px; max-width: 680px; margin: 0 auto; }
  section.view { display: none; }
  section.view.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 11.5px;
    color: var(--ink-muted);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .fieldhint { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .fieldhint.bad { color: var(--danger); font-weight: 600; }
  .fieldhint.ok { color: var(--success); font-weight: 600; }
  
  .field input[type="text"],
  .field input[type="number"],
  .field input[type="date"],
  .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    -webkit-appearance: none;
  }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1;
    border: none;
    background: var(--surface);
    color: var(--ink);
    padding: 10px 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: none; }
  .seg button.selected { background: var(--surface-alt); color: var(--ink); border-bottom: 2px solid var(--accent); }
  .seg button.selected.ok { background: var(--success-tint); color: var(--success); }
  .seg button.selected.bad { background: var(--danger-tint); color: var(--danger); }
  .seg button.selected.orange { background: var(--orange-soft); color: var(--orange-ink); }
  .seg button.selected.sfrblue { background: var(--blue-tint); color: var(--blue); }
  .seg button.selected.neutral { background: var(--surface-alt); color: var(--ink); }

  .preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface-alt);
    margin: 12px 0;
  }
  .preview .label { font-size: 12px; color: var(--ink-muted); }
  .preview .amount { font-family: var(--font-mono); font-size: 18px; font-weight: 700; }

  .btn-primary {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-ghost {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-muted);
    font-size: 12px;
    cursor: pointer;
  }

  .daytotal { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .daytotal .num { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
  .daytotal .sub { font-size: 11.5px; color: var(--ink-muted); }

  /* Carte Accordéon Compacte */
  .entry {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    overflow: hidden;
  }
  .entry-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
    gap: 8px;
  }
  .entry-header:active { background: var(--surface-alt); }
  .entry-title { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
  .entry-num { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--ink); }
  .entry-typo-badge { font-size: 11px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; }
  .entry-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .entry-amount { font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
  .entry-chevron { font-size: 10px; color: var(--ink-muted); transition: transform 0.2s ease; }
  .entry.open .entry-chevron { transform: rotate(180deg); }

  .entry-details {
    display: none;
    padding: 10px 12px;
    border-top: 1px dashed var(--line);
    background: var(--surface-alt);
    font-size: 11.5px;
  }
  .entry.open .entry-details { display: block; }
  
  .entry-addr { color: var(--ink); margin-bottom: 6px; word-break: break-word; }
  .entry-comment {
    font-style: italic;
    color: var(--ink-muted);
    margin-bottom: 8px;
    padding: 4px 8px;
    background: var(--surface);
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .entry-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .entry-tags { display: flex; gap: 4px; align-items: center; }
  .tag { font-size: 9.5px; font-weight: 600; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }
  .tag.ok { background: var(--success-tint); color: var(--success); }
  .tag.bad { background: var(--danger-tint); color: var(--danger); }
  .tag.neutral { background: var(--bg); color: var(--ink-muted); }

  .btn-gps {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
  }

  .entry-del {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
    font-weight: 600;
  }

  .empty { text-align: center; padding: 20px 10px; color: var(--ink-muted); font-size: 12.5px; }

  .monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .monthnav button {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    width: 32px; height: 32px;
    font-size: 14px; cursor: pointer;
  }
  .monthnav .label { font-family: var(--font-mono); font-weight: 600; font-size: 13.5px; text-transform: capitalize; }

  .summary-bar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .summary-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .summary-top .lbl { font-size: 11px; font-weight: 700; color: var(--ink-muted); }
  .summary-top .val { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--success); }

  .summary-sub {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
  }
  .op-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-weight: 600;
  }
  .op-badge.orange { background: var(--orange-soft); color: var(--orange-ink); }
  .op-badge.sfr { background: var(--blue-tint); color: var(--blue); }
  .summary-details { font-size: 11px; color: var(--ink-muted); text-align: right; }

  .daygroup {
    margin-bottom: 12px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }
  .daygroup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 2px 4px;
  }
  .daygroup-header h3 { font-family: var(--font-mono); font-size: 12px; font-weight: 700; margin: 0; }
  .daygroup-total { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-muted); }

  .day-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  @media (max-width: 520px) { .day-cols { grid-template-columns: 1fr; } }

  .col-op { background: var(--surface); border-radius: 6px; padding: 6px; border: 1px solid var(--line); }
  .col-op-header {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 3px 6px;
    border-radius: 4px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .col-op-header.orange { background: var(--orange-soft); color: var(--orange-ink); }
  .col-op-header.sfr { background: var(--blue-tint); color: var(--blue); }
  .col-empty { font-size: 10.5px; color: var(--ink-muted); text-align: center; padding: 8px 4px; font-style: italic; }

  table.tariffs { width: 100%; border-collapse: collapse; }
  table.tariffs th, table.tariffs td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  table.tariffs th { color: var(--ink-muted); font-weight: 500; font-size: 11px; }
  table.tariffs input {
    width: 70px; padding: 6px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface-alt);
    text-align: right; font-family: var(--font-mono);
  }

  nav.tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  .tabbar button {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px 6px;
    background: none; border: none; color: var(--ink-muted);
    cursor: pointer; font-size: 10.5px; font-weight: 500;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar svg { width: 19px; height: 19px; }

  .toast {
    position: fixed;
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <div class="brand">SUIVI · <strong>RACCORDEMENTS</strong></div>
  <h1 id="headerTitle">Nouvelle intervention</h1>
</header>

<main>

  <!-- ===== VUE SAISIE INTERVENTION ===== -->
  <section class="view active" id="view-saisie">
    <div class="card">
      <div class="field">
        <label for="f-date">Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Opérateur</label>
        <div class="seg" id="f-op">
          <button data-val="Orange" class="orange">Orange</button>
          <button data-val="SFR" class="sfrblue">SFR</button>
        </div>
      </div>
      <div class="field">
        <label for="f-num">N° intervention</label>
        <input type="text" id="f-num" placeholder="Ex: INT-0001">
        <div class="fieldhint" id="f-num-hint">Sélectionne l'opérateur.</div>
      </div>
      <div class="field">
        <label for="f-typo">Typologie raccordement</label>
        <select id="f-typo">
          <option value="">-- Sélectionner une typologie --</option>
        </select>
      </div>
      <div class="field">
        <label for="f-addr">Adresse client</label>
        <input type="text" id="f-addr" placeholder="12 rue de la Paix, Perpignan">
      </div>
      <div class="field">
        <label>Résultat</label>
        <div class="seg" id="f-statut">
          <button data-val="Réussite" class="ok">Réussite</button>
          <button data-val="Échec" class="bad">Échec</button>
        </div>
      </div>

      <!-- Mode Solo / Binôme + Menu Déroulant Solo -->
      <div class="field">
        <label>Solo / Binôme</label>
        <div class="seg" id="f-solo">
          <button data-val="Solo" class="neutral">Solo</button>
          <button data-val="Binôme" class="neutral">Binôme</button>
        </div>
      </div>
      <div class="field" id="wrap-tech-solo" style="display:none;">
        <label for="f-tech-solo">Technicien en Solo</label>
        <select id="f-tech-solo">
          <option value="Brendan">Brendan</option>
          <option value="Hamlili">Hamlili</option>
        </select>
      </div>

      <div class="field">
        <label for="f-comment">Commentaire (Colonne J)</label>
        <input type="text" id="f-comment" placeholder="Remarques, détails intervention...">
      </div>

      <div class="preview">
        <span class="label">Montant calculé</span>
        <span class="amount" id="f-preview">— €</span>
      </div>

      <button class="btn-primary" id="f-save">Enregistrer l'intervention</button>
    </div>

    <div class="daytotal">
      <div>
        <div class="num" id="todayTotal">0,00 €</div>
        <div class="sub" id="todayCount">0 intervention aujourd'hui</div>
      </div>
      <button class="btn-ghost" id="clearForm">Effacer</button>
    </div>

    <div id="todayList"></div>
  </section>

  <!-- ===== VUE CARBURANT ===== -->
  <section class="view" id="view-carburant">
    <div class="card">
      <div class="field">
        <label for="fuel-date">Date de mise du carburant</label>
        <input type="date" id="fuel-date">
      </div>

      <div class="field">
        <label>Qui a mis l'essence ?</label>
        <div class="seg" id="fuel-tech">
          <button data-val="Brendan" class="neutral selected">Brendan</button>
          <button data-val="Hamlili" class="neutral">Hamlili</button>
        </div>
      </div>

      <div class="field">
        <label for="fuel-amount">Montant Carburant (€)</label>
        <input type="number" step="0.01" id="fuel-amount" placeholder="Ex: 60.00">
      </div>

      <div class="field">
        <label for="fuel-comment">Commentaire / Station (Optionnel)</label>
        <input type="text" id="fuel-comment" placeholder="Ex: Station Total Perpignan">
      </div>

      <button class="btn-primary" id="fuel-save" style="margin-top:8px;">Enregistrer le plein</button>
    </div>

    <!-- Récapitulatif Carburant -->
    <div class="summary-bar">
      <div class="summary-top">
        <span class="lbl">TOTAL CARBURANT MOIS</span>
        <span class="val" id="fuelMonthTotal" style="color:var(--danger);">0,00 €</span>
      </div>
      <div class="summary-sub">
        <div style="font-size:11.5px; color:var(--ink-muted);">
          Brendan: <strong id="fuelBrendanTotal">0 €</strong> · Hamlili: <strong id="fuelHamliliTotal">0 €</strong>
        </div>
      </div>
    </div>

    <div id="fuelList"></div>
  </section>

  <!-- ===== VUE HISTORIQUE ===== -->
  <section class="view" id="view-historique">
    <div class="field" style="margin-bottom:10px;">
      <label>Feuille consultée :</label>
      <div class="seg" id="hist-tech-select">
        <button data-val="Brendan" class="neutral selected">Brendan</button>
        <button data-val="Hamlili" class="neutral">Hamlili</button>
      </div>
    </div>

    <div class="monthnav">
      <button id="prevMonth">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button id="nextMonth">›</button>
    </div>

    <div class="summary-bar">
      <div class="summary-top">
        <span class="lbl">TOTAL MOIS GLOBAL</span>
        <span class="val" id="totalGlobal">0,00 €</span>
      </div>
      <div class="summary-sub">
        <div style="display:flex; gap:6px;">
          <span class="op-badge orange">Orange: <strong id="totalOrange">0 €</strong></span>
          <span class="op-badge sfr">SFR: <strong id="totalSFR">0 €</strong></span>
        </div>
        <div class="summary-details">
          Solo: <strong id="totalSolo">0 €</strong> · Binôme: <strong id="totalBinome">0 €</strong>
        </div>
      </div>
    </div>

    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="histSearch" placeholder="🔍 Filtrer rue, n° int, commentaire...">
    </div>

    <button class="btn-primary" id="exportXlsx" style="margin-bottom:12px; padding:10px; font-size:13px;">Exporter ce mois en Excel</button>

    <div id="monthList"></div>
  </section>

  <!-- ===== VUE TARIFS ===== -->
  <section class="view" id="view-tarifs">
    <div class="card">
      <table class="tariffs">
        <thead>
          <tr><th>Typologie</th><th>Orange</th><th>SFR</th></tr>
        </thead>
        <tbody id="tariffRows"></tbody>
      </table>
    </div>
    <div class="card">
      <button class="btn-ghost" id="wipeAll" style="color:var(--danger); border-color:var(--danger); width:100%; padding:10px;">Réinitialiser la mémoire locale</button>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button data-view="saisie" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Saisie
  </button>
  <button data-view="carburant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v18M13 11h4a2 2 0 0 1 2 2v7a2 2 0 0 0 2 2M13 6h4"/><circle cx="7" cy="7" r="2"/></svg>
    Carburant
  </button>
  <button data-view="historique">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Historique
  </button>
  <button data-view="tarifs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    Tarifs
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUZ8Va_VV_J15W6gH26Xxq_MimoGbLfU_6cUUfxHhiRMqOMnBghSyWpkAx90zRtk1q/exec";

  var TYPOS = ["Aérien","Souterrain","Immeuble","PLP","SAV","PLP sans client"];
  var STORE_KEY = "raccordements_entries_v4";
  var FUEL_STORE_KEY = "raccordements_fuel_v4";
  var TARIFF_KEY = "raccordements_tarifs_v2";

  var DEFAULT_TARIFFS = {
    "Aérien": {Orange:160.00, SFR:null},
    "Souterrain": {Orange:112.00, SFR:null},
    "Immeuble": {Orange:54.40, SFR:null},
    "PLP": {Orange:36.00, SFR:null},
    "SAV": {Orange:36.00, SFR:null},

  }

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
  }

  // Analyseur de Date Universel (corrige le bug undefined/undefined)
  function parseISO(dateVal) {
    if (!dateVal) return new Date();
    if (dateVal instanceof Date) return dateVal;
    if (typeof dateVal === "string") {
      var s = dateVal.trim();
      if (s.indexOf('-') !== -1 && s.indexOf(' ') === -1 && s.indexOf('GMT') === -1) {
        var p = s.split('T')[0].split('-');
        if (p.length === 3) {
          return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        }
      }
      if (s.indexOf('/') !== -1) {
        var p = s.split('/');
        if (p.length === 3) {
          return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
        }
      }
    }
    var d = new Date(dateVal);
    return isNaN(d.getTime()) ? new Date() : d;
  }

  function toISODate(dateVal) {
    var d = parseISO(dateVal);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + "-" + m + "-" + day;
  }

  function fmtDateFR(dateVal) {
    if (!dateVal) return "";
    var d = parseISO(dateVal);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return day + "/" + m + "/" + y;
  }

  function computeMontant(typo, statut, op){

    if (statut === "Échec") return 0;

    var v = row[op];
    return (v === null || v === undefined) ? 0 : v;

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderHistorique(){
    var y = viewedMonth.getFullYear(), m = viewedMonth.getMonth();
    document.getElementById('monthLabel').textContent = MOIS_FR[m] + " " + y;
    currentMonthLabel = MOIS_FR[m] + "_" + y;

    var monthEntries = entries.filter(function(e){
      var d = parseISO(e.date);
      return d.getFullYear() === y && d.getMonth() === m;
    });

    var q = searchInput.value.trim().toLowerCase();
    var filteredEntries = monthEntries.filter(function(e){
      if (!q) return true;
      var str = (e.num + " " + (e.addr||"") + " " + (e.comment||"") + " " + e.typo + " " + e.op + " " + e.statut + " " + e.solo).toLowerCase();
      return str.indexOf(q) !== -1;
    });

    currentMonthEntries = monthEntries.slice().sort(function(a,b){
      var da = toISODate(a.date), db = toISODate(b.date);
      return da < db ? -1 : (da > db ? 1 : 0);
    });

    var totGlobal = monthEntries.reduce(function(s,e){ return s + (e.montant||0); }, 0);
    var totOrange = monthEntries.filter(function(e){ return e.op === "Orange"; }).reduce(function(s,e){ return s+(e.montant||0); }, 0);
    var totSFR = monthEntries.filter(function(e){ return e.op === "SFR"; }).reduce(function(s,e){ return s+(e.montant||0); }, 0);
    var totBinome = monthEntries.filter(function(e){ return e.solo === "Binôme"; }).reduce(function(s,e){ return s+(e.montant||0); }, 0);
    var totSolo = monthEntries.filter(function(e){ return e.solo === "Solo"; }).reduce(function(s,e){ return s+(e.montant||0); }, 0);

    document.getElementById('totalGlobal').textContent = fmtEuro(totGlobal);
    document.getElementById('totalOrange').textContent = fmtEuro(totOrange);
    document.getElementById('totalSFR').textContent = fmtEuro(totSFR);
    document.getElementById('totalBinome').textContent = fmtEuro(totBinome);
    document.getElementById('totalSolo').textContent = fmtEuro(totSolo);

    var list = document.getElementById('monthList');
    list.innerHTML = "";

    if (filteredEntries.length === 0){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = q ? "Aucun résultat pour cette recherche." : "Aucune intervention ce mois-ci.";
      list.appendChild(e);
      return;
    }

    var byDay = {};
    filteredEntries.forEach(function(en){
      var isoKey = toISODate(en.date);
      if (!byDay[isoKey]) byDay[isoKey] = [];
      byDay[isoKey].push(en);
    });

    Object.keys(byDay).sort().reverse().forEach(function(dateIso){
      var dayItems = byDay[dateIso];
      var dayTot = dayItems.reduce(function(s,e){ return s + (e.montant||0); }, 0);

      var group = document.createElement('div');
      group.className = 'daygroup';

      var header = document.createElement('div');
      header.className = 'daygroup-header';
      header.innerHTML = '<h3>' + fmtDateFR(dateIso) + '</h3><span class="daygroup-total">' + fmtEuro(dayTot) + '</span>';
      group.appendChild(header);

      var dayCols = document.createElement('div');
      dayCols.className = 'day-cols';

      ["Orange", "SFR"].forEach(function(opName){
        var col = document.createElement('div');
        col.className = 'col-op';
        var opItems = dayItems.filter(function(x){ return x.op === opName; });
        var opTot = opItems.reduce(function(s,e){ return s + (e.montant||0); }, 0);
        var opClass = opName === "Orange" ? "orange" : "sfr";

        col.innerHTML = '<div class="col-op-header ' + opClass + '"><span>' + opName + '</span><span>' + fmtEuro(opTot) + '</span></div>';

        if (opItems.length === 0) {
          col.innerHTML += '<div class="col-empty">Aucune int.</div>';
        } else {
          opItems.forEach(function(item){
            col.appendChild(entryCard(item));
          });
        }
        dayCols.appendChild(col);
      });

      group.appendChild(dayCols);
      list.appendChild(group);
    });
  }

    });
  }

  document.getElementById('wipeAll').addEventListener('click', function(){
    if (confirm("Réinitialiser les données locales (" + currentViewTech + ") ?")){
      localStorage.removeItem(STORE_KEY + "_" + currentViewTech);
      entries = [];
      renderToday();
      renderHistorique();
      toast("Mémoire locale réinitialisée");
    }
  });

  // Détection de retour sur l'application (Auto-Synchro)
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") {
      loadEntries();
      if (document.getElementById('view-carburant').classList.contains('active')) {
        loadFuel();
      }
    }
  });

  window.addEventListener("focus", function() {
    loadEntries();
  });

  document.querySelector('header.top').style.cursor = 'pointer';
  document.querySelector('header.top').addEventListener('click', function(){
    loadEntries();
    loadFuel();
  });

  document.addEventListener("DOMContentLoaded", function(){
    loadEntries();
  });

})();
</script>
</body>
</html>
